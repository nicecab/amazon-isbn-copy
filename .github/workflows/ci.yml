name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  manifest:
    name: Validate manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check manifest.json is valid JSON
        run: jq empty manifest.json
      - name: Check files referenced by manifest.json exist
        run: |
          missing=0
          for f in $(jq -r '[.icons[]?, .action.default_icon?, .background.service_worker?, .content_scripts[]?.js[]?] | map(select(type == "string")) | unique[]' manifest.json); do
            if [ ! -f "$f" ]; then
              echo "::error file=manifest.json::Missing file: $f"
              missing=1
            fi
          done
          exit "$missing"
